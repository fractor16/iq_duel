name: iq_duel
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  audioplayers: ^6.5.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.2.1
  google_fonts: ^8.0.2
  google_mobile_ads: ^7.0.0
  in_app_purchase: ^3.2.3
